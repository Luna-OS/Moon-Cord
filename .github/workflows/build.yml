name: Build

on:
    pull_request:
    workflow_call:
        inputs:
            ref:
                description: "Commit, der gebaut werden soll (Standard: der auslösende)"
                type: string
                required: false
    workflow_dispatch:

env:
    FORCE_COLOR: true

jobs:
    build:
        name: Build (${{ matrix.platform }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      platform: win
                    - os: ubuntu-latest
                      platform: linux

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v6 # Version aus "packageManager" in package.json

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Kurz-Hash für Vencords Updater
              shell: bash
              run: echo "MOON_CORD_HASH=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

            - name: Moon-Cord bauen
              run: node scripts/build.mjs --dist --${{ matrix.platform }}

            # Installer für das echte Discord (Windows + Linux, aus dem Linux-Job)
            - uses: actions/setup-go@v6
              if: matrix.platform == 'linux'
              with:
                  go-version-file: installer/go.mod
                  cache: false

            - name: Moon-Cord für Discord bauen
              if: matrix.platform == 'linux'
              run: node scripts/build-installer.mjs

            - uses: actions/upload-artifact@v4
              with:
                  name: moon-cord-${{ matrix.platform }}
                  if-no-files-found: error
                  path: |
                      dist/*.exe
                      dist/*.zip
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.tar.gz
                      dist/*.yml
                      dist/*.blockmap
                      dist/vencordDesktop*
                      dist/moon-cord-discord-installer-linux
                      dist/patcher.js
                      dist/preload.js
                      dist/renderer.js
                      dist/renderer.css
